name: Golden_Harvest_Bot

on:
  workflow_dispatch: # 允许你手动点火
  schedule:
    - cron: '0 * * * *' # 每小时自动收割一次

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - name: 🛰️ 抓取并注入
        run: |
          # 抓取三个主力源
          DATA1=$(curl -sL https://raw.githubusercontent.com/freefq/free/master/v2ray)
          DATA2=$(curl -sL https://raw.githubusercontent.com/vfarid/v2ray-share/main/all.txt)
          DATA3=$(curl -sL https://raw.githubusercontent.com/awesome-vpn/test/main/all.txt)
          
          # 合并数据
          ALL_DATA="${DATA1}"$'\n'"${DATA2}"$'\n'"${DATA3}"
          
          # 推送到甲骨文仓库
          curl -X POST "${{ secrets.SUB_URL }}" \
            -d "key=tomato666" \
            --data-urlencode "data=${ALL_DATA}"
