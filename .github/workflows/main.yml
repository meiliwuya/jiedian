name: Golden_Final_Push
on:
  workflow_dispatch:
jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - name: 🛰️ 抓取活源并注入
        run: |
          # 1. 从那个被你验证为“活”的地址抓取
          DATA=$(curl -sL --max-time 30 "https://raw.githubusercontent.com/mfuu/v2ray/master/v2ray")
          
          # 2. 简单的安全检查
          if [[ "$DATA" == *"404"* ]] || [ ${#DATA} -lt 100 ]; then
            echo "源站数据异常，停止注入"
            exit 1
          fi

          # 3. 注入甲骨文 (确认你的 Secrets 里的 SUB_URL 是正确的)
          curl -X POST -L "${{ secrets.SUB_URL }}" \
            -d "key=tomato666" \
            --data-urlencode "data=${DATA}"
