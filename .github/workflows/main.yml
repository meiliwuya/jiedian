name: Golden_Test_Only
on:
  workflow_dispatch:
jobs:
  test_harvest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: 暴力抓取并显示日志
        run: |
          # 使用一个极其稳定的、专为 GitHub 设计的代理源
          echo "正在尝试抓取..."
          curl -sL --max-time 30 "https://raw.githubusercontent.com/freefq/free/master/v2ray" > nodes_test.txt
          
          # 调试信息：在 GitHub 日志里打印文件前 5 行，让我们看清它是真节点还是 404
          echo "--- 抓取内容预览 ---"
          head -n 5 nodes_test.txt
          echo "--- 预览结束 ---"
          
      - name: 推送回仓库
        run: |
          git config --global user.name "TomatoBot"
          git config --global user.email "bot@tomato.plus"
          git add nodes_test.txt
          git commit -m "push debug info" || echo "no changes"
          git push
