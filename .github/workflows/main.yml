- name: 🛰️ 强力收割并注入
        run: |
          # 使用公开的解析接口作为源，这些源非常稳定且自带翻墙
          DATA=$(curl -sL "https://api.v1.mk/sub?target=v2ray&url=https://raw.githubusercontent.com/freefq/free/master/v2ray")
          
          # 检查抓到的数据是否有效，如果抓到的是 404 文本，直接拦截不发送
          if [[ "$DATA" == *"404"* ]] || [[ "$DATA" == "" ]]; then
            echo "抓取失败，拒绝注入空数据或错误页面"
            exit 1
          fi
          
          # 执行注入
          curl -X POST -L "${{ secrets.SUB_URL }}" \
            -A "Mozilla/5.0" \
            -d "key=tomato666" \
            --data-urlencode "data=${DATA}"
