name: Golden_Test_Only

on:
  workflow_dispatch: # 仅支持手动点火

jobs:
  test_harvest:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 赋予机器人写入仓库文件的权限
    steps:
      - name: 1. 检出仓库代码
        uses: actions/checkout@v3

      - name: 2. 强力抓取并净化
        run: |
          # 尝试从主力源抓取
          RAW=$(curl -sL "https://raw.githubusercontent.com/freefq/free/master/v2ray")
          
          # 净化：只要带协议的行
          CLEAN=$(echo "$RAW" | grep -Ei "vmess://|vless://|ss://|trojan://")
          
          # 将结果写入本地文件
          echo "$CLEAN" > nodes_test.txt
          
          echo "抓取完成，文件大小：$(wc -c < nodes_test.txt) 字节"

      - name: 3. 将生成的txt推送到仓库
        run: |
          git config --global user.name "TomatoBot"
          git config --global user.email "bot@tomato.plus"
          git add nodes_test.txt
          git commit -m "🛰️ 自动收割测试更新: $(date)" || echo "没有内容变化"
          git push
