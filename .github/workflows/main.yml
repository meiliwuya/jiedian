- name: 🛰️ 全能收割并注入
        run: |
          # 尝试从四个不同的主力源抓取
          SRC1=$(curl -sL "https://raw.githubusercontent.com/freefq/free/master/v2ray")
          SRC2=$(curl -sL "https://raw.githubusercontent.com/vfarid/v2ray-share/main/all.txt")
          SRC3=$(curl -sL "https://raw.githubusercontent.com/awesome-vpn/test/main/all.txt")
          SRC4=$(curl -sL "https://sub.shushubai.com/v2ray")
          
          # 合并所有数据
          ALL_DATA="${SRC1}"$'\n'"${SRC2}"$'\n'"${SRC3}"$'\n'"${SRC4}"
          
          # 关键：过滤掉所有的 404 错误字样，只留下包含协议的行
          CLEAN_DATA=$(echo "$ALL_DATA" | grep -E "vmess://|vless://|ss://|trojan://")
          
          # 检查过滤后的数据量
          if [ ${#CLEAN_DATA} -lt 100 ]; then
            echo "❌ 失败：所有源均未抓取到有效节点数据。"
            exit 1
          fi
          
          echo "✅ 过滤成功，抓取到有效节点。准备注入甲骨文..."

          # 执行注入
          curl -X POST -L "${{ secrets.SUB_URL }}" \
            -A "Mozilla/5.0" \
            -d "key=tomato666" \
            --data-urlencode "data=${CLEAN_DATA}"
