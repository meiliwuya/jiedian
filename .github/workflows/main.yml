name: Golden_Test_Only
on:
  workflow_dispatch:
jobs:
  test_harvest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: 🛰️ 暴力抓取与日志拆解
        run: |
          # 1. 直接抓取，不做任何判断
          echo "正在尝试从源站取货..."
          curl -sL --max-time 20 "https://raw.githubusercontent.com/freefq/free/master/v2ray" > nodes_test.txt
          
          # 2. 核心调试：把抓到的前10行直接喷在屏幕上
          echo "==== 抓取内容实况开始 ===="
          head -n 10 nodes_test.txt
          echo "==== 抓取内容实况结束 ===="
          
          # 3. 打印文件大小
          echo "文件总大小: $(wc -c < nodes_test.txt) 字节"

      - name: 🚚 强行推送到仓库
        run: |
          git config --global user.name "TomatoBot"
          git config --global user.email "bot@tomato.plus"
          git add nodes_test.txt
          git commit -m "debug: $(date)" || echo "no changes"
          git push
