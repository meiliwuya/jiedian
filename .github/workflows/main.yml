name: Golden_Harvest_Bot

on:
  workflow_dispatch: # 支持手动点火
  schedule:
    - cron: '0 * * * *' # 每小时自动收割一次

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - name: 🛰️ 强力收割并注入甲骨文
        run: |
          # 1. 抓取货源（使用 api.v1.mk 确保在 GitHub 环境下也能顺利拿到数据）
          DATA=$(curl -sL "https://api.v1.mk/sub?target=v2ray&url=https://raw.githubusercontent.com/freefq/free/master/v2ray")
          
          # 2. 严密检查：如果抓到的是 404 文本或空数据，立即中止，不污染服务器
          if [[ "$DATA" == *"404"* ]] || [ -z "$DATA" ] || [ ${#DATA} -lt 100 ]; then
            echo "错误：抓取结果无效（可能是404或空数据），本次注入取消。"
            exit 1
          fi
          
          echo "成功抓取到有效数据，长度：${#DATA} 字节。准备注入..."

          # 3. 执行物理注入（发送到你的 sub.php）
          # -L 追踪重定向, -A 伪装浏览器, --data-urlencode 确保特殊字符不丢
          curl -X POST -L "${{ secrets.SUB_URL }}" \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
            -d "key=tomato666" \
            --data-urlencode "data=${DATA}"
          
          echo "注入指令已送达甲骨文指挥部。"
